<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Watchless Push: push arrow (same as Push) + red eye-off badge (no watcher) -->
  <g transform="translate(4 4)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Push arrow: up out of a tray -->
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
    <polyline points="17 8 12 3 7 8"/>
    <line x1="12" y1="3" x2="12" y2="15"/>
  </g>
  <!-- Red eye-off badge (top-right): no watcher -->
  <g fill="none" stroke="#FF5252" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 7.5c1.3-1.8 2.6-2.75 4.5-2.75s3.2.95 4.5 2.75c-1.3 1.8-2.6 2.75-4.5 2.75s-3.2-.95-4.5-2.75z"/>
    <circle cx="25" cy="7.5" r="1.3"/>
    <line x1="18.5" y1="3.5" x2="31.5" y2="11.5"/>
  </g>
</svg>